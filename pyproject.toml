[project]
name = "everlink"
version = "1.0.0"
authors = [
  { name="Elh", email="elh.git@proton.me" },
]
description = "A simple proxy that automatically refreshes expired download links for download managers."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.15.0",
    "cashews>=7.5.0",
    "lxml>=6.1.1",
    "multidict>=6.7.1",
    "starlette>=1.6.0",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[project.scripts]
everlink = "everlink.main:main"

[tool.uv]
package = true
